name: 작업
description: 한 작업과 검증 기준을 정의합니다.
title: "chore: "
body:
  - type: textarea
    id: outcome
    attributes:
      label: 문제와 완료 결과
      description: 사용자에게 어떤 행동이 가능해지는지 적습니다.
    validations:
      required: true
  - type: input
    id: milestone
    attributes:
      label: 마일스톤
      description: 생성 후 GitHub Milestone 필드에도 지정합니다.
    validations:
      required: true
  - type: textarea
    id: requirements
    attributes:
      label: 요구·설계·시나리오·선행 이슈
      description: FR/NFR, 설계 링크, TS 번호와 선행 PR을 적습니다.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 인수 조건과 검증
      value: "- [ ] 관측 가능한 인수 조건\n- [ ] 관련 검증\n- [ ] 설계·문서 갱신\n- [ ] develop PR 리뷰·병합 뒤 종료"
    validations:
      required: true
