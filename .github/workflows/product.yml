name: Product checks
on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
permissions:
  contents: read
concurrency:
  group: product-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo check --locked -p liar-wasm --target wasm32-unknown-unknown
      - run: cargo run --locked -p liar-protocol --bin export-types -- --check
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: liar_test
          POSTGRES_PASSWORD: development-only
          POSTGRES_DB: liar_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U liar_test -d liar_test"
          --health-interval 2s --health-timeout 2s --health-retries 20
    env:
      DATABASE_URL: postgres://liar_test:development-only@localhost:5432/liar_test
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p liar-server --test postgres -- --ignored
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-failures
          path: test-results/
          retention-days: 7
