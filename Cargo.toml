[workspace]
members = ["crates/core", "crates/protocol", "crates/server", "crates/wasm"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
