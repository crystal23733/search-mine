[package]
name = "liar-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
default-run = "liar-server"

[dependencies]
aes-gcm = "0.11.1"
axum = "0.8.9"
base64 = "0.23.1"
getrandom = "0.4.3"
hmac = "0.13.0"
liar-protocol = { version = "0.1.0", path = "../protocol" }
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "migrate"] }
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
unicode-normalization = "0.1.25"
unicode-segmentation = "1.13.3"
uuid = { version = "1.27.0", features = ["v4"] }
zeroize = { version = "1.9.1", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0.151"
tower = { version = "0.5.3", features = ["util"] }

[lints]
workspace = true
