[package]
name = "liar-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
axum = "0.8.9"
liar-protocol = { version = "0.1.0", path = "../protocol" }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres"] }
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }

[dev-dependencies]
serde_json = "1.0.151"
tower = { version = "0.5.3", features = ["util"] }

[lints]
workspace = true
