worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/null crit;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    # Pair a fresh CSP nonce with a fresh HTML body; never reuse a 304 body.
    etag off;
    if_modified_since off;
    sub_filter_once off;
    sub_filter_last_modified off;
    sub_filter LIAR_DOCUMENT_NONCE $request_id;
    access_log off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    # The application remains authoritative for its 2 MiB replay + envelope limit.
    client_max_body_size 3m;
    client_body_timeout 5s;
    send_timeout 5s;
    keepalive_timeout 15s;
    resolver 127.0.0.11 valid=10s ipv6=off;
    include /etc/nginx/routes.conf;
    server {
        listen 8080;
        root /usr/share/nginx/html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy $document_referrer always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy $content_security_policy always;
        add_header Cache-Control $response_cache always;
        add_header X-Robots-Tag $document_robots always;
        set $api_upstream http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host server;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header Forwarded "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 2s;
        proxy_read_timeout 60s;
        proxy_send_timeout 5s;
        proxy_hide_header Cache-Control;
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
        proxy_buffering off;
        location ^~ /api/ { proxy_pass $api_upstream; }
        location = /health/live { proxy_pass $api_upstream; }
        location = /health/ready { proxy_pass $api_upstream; }
        location ~ ^/assets/[a-zA-Z0-9_/-]+\.(?:js|css|wasm)$ {
            limit_except GET HEAD { deny all; }
            try_files $uri =404;
        }
        location ~ ^/core/liar_wasm(?:_bg)?\.(?:js|wasm)$ {
            limit_except GET HEAD { deny all; }
            try_files $uri =404;
        }
        location = /manifest.webmanifest {
            default_type application/manifest+json;
            try_files $uri =404;
        }
        location ~ ^/icons/[a-zA-Z0-9_-]+\.(?:png|svg|ico)$ {
            limit_except GET HEAD { deny all; }
            try_files $uri =404;
        }
        location = /service-worker.js { try_files $uri =404; }
        location = /robots.txt { try_files $uri =404; }
        location = /sitemap.xml { try_files $uri =404; }
        location = /ads.txt { default_type text/plain; try_files $uri =404; }
        location ~ ^/policies/(?:en|ko|ja|zh-CN|es|pt-BR|de|fr)\.json$ {
            limit_except GET HEAD { deny all; }
            default_type application/json;
            try_files $uri =404;
        }
        location = /favicon.ico { try_files $uri =404; }
        location ~ /\. { return 404; }
        location / {
            limit_except GET HEAD { deny all; }
            if ($document_status = 403) { return 403; }
            if ($document_status = 404) { return 404; }
            try_files $document_file =404;
        }
        error_page 403 =403 /__liar_error_403;
        error_page 404 =404 /__liar_error_404;
        location = /__liar_error_403 { internal; try_files /index.html =403; }
        location = /__liar_error_404 { internal; try_files /index.html =404; }
    }
}
