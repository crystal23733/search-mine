services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: liar_test
      POSTGRES_PASSWORD: development-only
      POSTGRES_DB: liar_test
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liar_test -d liar_test"]
      interval: 2s
      timeout: 2s
      retries: 20
